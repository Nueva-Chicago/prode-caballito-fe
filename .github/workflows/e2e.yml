name: E2E Tests

on:
  # Se dispara automáticamente cuando el deploy termina con éxito
  workflow_run:
    workflows: ["Deploy to S3 + CloudFront"]
    types: [completed]
  # También se puede correr manualmente desde Actions
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Solo corre si el deploy fue exitoso (o si se disparó manualmente)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: npx playwright install chromium --with-deps

      - name: Esperar a que CloudFront propague el deploy
        run: sleep 15

      - name: Auth setup (login y guardar sesión)
        env:
          E2E_EMAIL:    ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test e2e/auth.setup.ts

      - name: Correr tests E2E
        run: npx playwright test --project=chromium

      - name: Subir reporte si fallan
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
